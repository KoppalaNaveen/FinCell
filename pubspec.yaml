name: fincell
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
    
  firebase_core: ^2.27.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.0

  google_sign_in: ^6.2.1
  geolocator: ^10.1.0
  device_info_plus: ^9.1.2
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.6.0
  flutter_background_service: ^5.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5
  local_auth: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  android_intent_plus: ^4.0.0
  cloud_functions: ^4.7.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  
  flutter_lints: ^6.0.0



flutter:

  uses-material-design: true
  assets:
    - assets/icon/fincell_icon.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/fincell_icon.png"
  min_sdk_android: 21
